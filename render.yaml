services:
  - type: web
    name: wedding-invites
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PIN
        value: "282834"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-db
          property: connectionString

databases:
  - name: wedding-db
    plan: free
